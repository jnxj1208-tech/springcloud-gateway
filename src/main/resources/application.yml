server:
  port: 8080

spring:
  application:
    name: springcloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
        file-extension: yaml
        import-check:
          enabled: false
        # 配置变更时发布 EnvironmentChangeEvent，配合 RoutesRefreshListener 刷新路由缓存
        refresh-enabled: true
  # 路由定义不写在镜像里：来自 Nacos 配置中心
  #   dataId: springcloud-gateway.yaml, group: DEFAULT_GROUP, namespace: public
  # 改路由/改 Path 谓词后自动刷新，无需重建镜像
  config:
    import:
      - optional:nacos:springcloud-gateway.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: springcloud-gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.alibaba.csp.sentinel: INFO
    com.example.gateway: DEBUG

gateway:
  auth:
    # 生产必须 true：false 时网关不验签，下游租户上下文会退化回"客户端自报"
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    # 免验签路径（Ant 风格）。auth 下的都是临时令牌流程，选租户后才换出正式 token
    whitelist:
      - /api/v1/identity/auth/**
      - /actuator/**
      - /__fallback
      - /api/v1/demo/**
    jwt:
      # 与 identity-service 共用 K8s Secret identity-secret/jwt-secret
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:photo-saas-identity}
  internal-error:
    # 日志目录探活路径；留空时回退到 -Dcsp.sentinel.log.dir，再回退 /tmp/csp-logs
    log-probe-dir: ${GATEWAY_INTERNAL_ERROR_LOG_PROBE_DIR:}
    probe-interval-seconds: 60
    failure-cooldown-seconds: 300
