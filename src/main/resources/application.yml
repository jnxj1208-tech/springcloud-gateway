server:
  port: 8080

spring:
  application:
    name: springcloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
        file-extension: yaml
        import-check:
          enabled: false
    # ⚠️ SCG 5.x 新命名空间：spring.cloud.gateway.server.webflux.routes
    # 写成旧的 spring.cloud.gateway.routes 不会报错，但一条路由都不会加载
    gateway:
      server:
        webflux:
          routes:
            # 下游服务已注册到 Nacos，走 lb:// 由 LoadBalancer 解析实例
            # 注意：demo 的端点本身就是 /api/hello，所以这里不能加 StripPrefix，
            # 加了会把 /api/hello 变成 /hello 而 404
            - id: springcloud-demo-route
              uri: ${DEMO_SERVICE_URI:lb://springcloud-demo}
              predicates:
                - Path=/api/**
  config:
    import:
      - optional:nacos:springcloud-gateway.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: springcloud-gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.alibaba.csp.sentinel: INFO
    com.example.gateway: DEBUG
