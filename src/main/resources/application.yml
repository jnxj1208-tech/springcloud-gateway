server:
  port: 8080

spring:
  application:
    name: springcloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: public
        file-extension: yaml
        import-check:
          enabled: false
        # 配置变更时发布 EnvironmentChangeEvent，配合 RoutesRefreshListener 刷新路由缓存
        refresh-enabled: true
  # 路由定义不写在镜像里：来自 Nacos 配置中心
  #   dataId: springcloud-gateway.yaml, group: DEFAULT_GROUP, namespace: public
  # 改路由/改 Path 谓词后自动刷新，无需重建镜像
  config:
    import:
      - optional:nacos:springcloud-gateway.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: springcloud-gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.alibaba.csp.sentinel: INFO
    com.example.gateway: DEBUG
