apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sgw.fullname" . }}
  labels:
    {{- include "sgw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "sgw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sgw.selectorLabels" . | nindent 8 }}
        # Alloy 用 pod 的 app 标签给日志打 index label，缺了它 Loki 里就没有 app 维度
        app: {{ .Values.otel.serviceName | quote }}
      annotations:
        app.kubernetes.io/image-tag: {{ .Values.image.tag | quote }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ include "sgw.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ required "必须通过 --set image.tag=sha-xxxx 指定镜像 tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
            - name: sentinel-api
              containerPort: {{ .Values.service.sentinelApiPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: NACOS_ADDR
              value: {{ .Values.nacosAddr | quote }}
            - name: NACOS_USERNAME
              value: {{ .Values.nacosUsername | quote }}
            - name: NACOS_PASSWORD
              value: {{ .Values.nacosPassword | quote }}
            - name: DEMO_SERVICE_URI
              value: {{ .Values.demoServiceUri | quote }}
            - name: SENTINEL_DASHBOARD
              value: {{ .Values.sentinelDashboardAddr | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 网关鉴权：密钥来自 identity 的 Secret（同一个值才能验它签的 token）
            - name: GATEWAY_AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwt.secretRef.name }}
                  key: {{ .Values.auth.jwt.secretRef.key }}
            - name: JWT_ISSUER
              value: {{ .Values.auth.jwt.issuer | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.sampler | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otel.metricsExporter | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.otel.logsExporter | quote }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
